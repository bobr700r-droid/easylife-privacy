<h3>Komandér 0.11.4</h3>
<ul>
<li><b>Už nezamrzá kvůli NASu:</b> když síťový disk chvíli neodpovídá, Komandér dřív po pár kliknutích přestal reagovat úplně. Čtení složek, velikostí, náhledu a našeptávače cesty teď běží odděleně a panel po 12 sekundách ohlásí „Složka neodpovídá“ – zbytek appky jede dál.</li>
</ul>
